name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false # no cortar un despliegue a medias

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tsc, unitarias, concurrencia contra PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - name: Pruebas de concurrencia (npm run test:int)
        run: npm run test:int
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
      - run: npm run build

  ai-service:
    name: ai-service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    name: Frontend (tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vite build

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  deploy:
    name: Desplegar en Cloud Run
    needs: [backend, ai-service, frontend, terraform]
    # Solo en main y cuando la infraestructura ya existe (variables configuradas en el repo)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC para Workload Identity Federation
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          echo "REGISTRY=${REGION}-docker.pkg.dev/${PROJECT_ID}/smartbancs" >> "$GITHUB_ENV"

      - name: Construir y publicar backend, ai-service y migración
        run: |
          docker build -t "$REGISTRY/backend:$TAG" backend
          docker build -t "$REGISTRY/ai-service:$TAG" ai-service
          docker build -t "$REGISTRY/db-migrate:$TAG" -f backend/sql/Dockerfile.migrate backend/sql
          docker push "$REGISTRY/backend:$TAG"
          docker push "$REGISTRY/ai-service:$TAG"
          docker push "$REGISTRY/db-migrate:$TAG"

      - name: Migrar base de datos (Cloud Run Job, idempotente)
        run: |
          gcloud run jobs update smartbancs-db-migrate --image "$REGISTRY/db-migrate:$TAG" --region "$REGION" --quiet
          gcloud run jobs execute smartbancs-db-migrate --region "$REGION" --wait

      - name: Desplegar backend
        run: |
          gcloud run deploy smartbancs-backend --image "$REGISTRY/backend:$TAG" --region "$REGION" --quiet
          BACKEND_URL=$(gcloud run services describe smartbancs-backend --region "$REGION" --format='value(status.url)')
          echo "BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"

      - name: Desplegar ai-service
        run: gcloud run deploy smartbancs-ai-service --image "$REGISTRY/ai-service:$TAG" --region "$REGION" --quiet

      - name: Construir y desplegar frontend (con la URL pública del backend)
        run: |
          docker build --build-arg "VITE_API_URL=${BACKEND_URL}/api/v1" -t "$REGISTRY/frontend:$TAG" frontend
          docker push "$REGISTRY/frontend:$TAG"
          gcloud run deploy smartbancs-frontend --image "$REGISTRY/frontend:$TAG" --region "$REGION" --quiet
          FRONTEND_URL=$(gcloud run services describe smartbancs-frontend --region "$REGION" --format='value(status.url)')
          echo "FRONTEND_URL=$FRONTEND_URL" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 "${BACKEND_URL}/api/v1/accounts" > /dev/null
          curl -fsS "${BACKEND_URL}/metrics" | grep -q smartbancs_transactions_total
          curl -fsS "${FRONTEND_URL}" > /dev/null
          {
            echo "### Despliegue ${TAG::7}"
            echo "- Frontend: ${FRONTEND_URL}"
            echo "- Backend: ${BACKEND_URL}/api/v1"
          } >> "$GITHUB_STEP_SUMMARY"
