services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbancs-postgres
    restart: unless-stopped
    # Diagnóstico del incidente de quincena (R3.5a-c):
    #  - pg_stat_statements: ranking de consultas por tiempo total / media
    #  - log_lock_waits: registra la consulta bloqueada y el PID que la bloquea
    #  - log_min_duration_statement: registra toda consulta > 500 ms
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_lock_waits=on
      -c deadlock_timeout=1s
      -c log_min_duration_statement=500
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartbancs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/00-observability.sql:/docker-entrypoint-initdb.d/00-observability.sql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartbancs_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartbancs-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smartbancs-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # RabbitMQ Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smartbancs-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbancs-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: smartbancs_db
      DB_SYNCHRONIZE: "false"
      DB_POOL_MAX: 30
      DB_POOL_MIN: 5
      DB_LOCK_TIMEOUT_MS: 2000        # G3: espera máxima por un lock de fila (SQLSTATE 55P03)
      DB_STATEMENT_TIMEOUT_MS: 5000   # G3: duración máxima de una sentencia (SQLSTATE 57014)
      TX_MAX_ATTEMPTS: 3              # reintentos ante deadlock 40P01 / serialización 40001
      OUTBOX_POLL_INTERVAL_MS: 500    # G1: frecuencia del relay del outbox
      OUTBOX_BATCH_SIZE: 100
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # Demo: habilita /api/v1/simulation (pico de quincena y db-diagnostics). En producción: false.
      SIMULATION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - smartbancs-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartbancs-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      BACKEND_API_URL: http://backend:4000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      - rabbitmq
      - backend
    networks:
      - smartbancs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbancs-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartbancs-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: smartbancs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - smartbancs-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: smartbancs-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - smartbancs-network

networks:
  smartbancs-network:
    driver: bridge

volumes:
  postgres_data:
