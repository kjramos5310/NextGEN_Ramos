services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbancs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartbancs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartbancs_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartbancs-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smartbancs-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # RabbitMQ Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - smartbancs-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbancs-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      LOG_LEVEL: info
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: smartbancs_db
      DB_SYNCHRONIZE: "false"
      DB_POOL_MAX: 30
      DB_POOL_MIN: 5
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - smartbancs-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: smartbancs-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      BACKEND_API_URL: http://backend:4000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      - rabbitmq
      - backend
    networks:
      - smartbancs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbancs-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartbancs-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: smartbancs-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - smartbancs-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: smartbancs-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - smartbancs-network

networks:
  smartbancs-network:
    driver: bridge

volumes:
  postgres_data:
